plugins {
	id 'java-library'
}

description = 'Placeholder for the future Fabric Minecraft 1.21.x implementation'

dependencies {
	implementation project(':common')
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// This module is intentionally not distributable until the actual port begins.
tasks.named('jar') {
	enabled = false
}
